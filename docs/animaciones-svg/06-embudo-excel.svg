        <circle cx="842" cy="905" r="40" fill="#FFFFFF" stroke="#2563EB" stroke-width="7"/>
        <line x1="906" y1="882" x2="1106" y2="882" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round"/>
        <line x1="906" y1="928" x2="1046" y2="928" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round"/>
      </g>
      <g id="tarjeta-3">
        <rect x="1190" y="820" width="380" height="170" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="5"/>
        <circle cx="1262" cy="905" r="40" fill="#FFFFFF" stroke="#2563EB" stroke-width="7"/>
