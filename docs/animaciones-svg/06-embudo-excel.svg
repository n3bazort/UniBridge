      <rect x="766" y="150" width="120" height="56" rx="5"/>
      <rect x="900" y="150" width="120" height="56" rx="5"/>
      <rect x="1034" y="150" width="120" height="56" rx="5"/>
      <rect x="1168" y="150" width="120" height="56" rx="5"/>
    </g>
    <g id="celdas-datos" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3">
      <rect id="celda-2-1" x="632" y="220" width="120" height="56" rx="5"/>
      <rect id="celda-2-2" x="766" y="220" width="120" height="56" rx="5"/>
      <rect id="celda-2-3" x="900" y="220" width="120" height="56" rx="5"/>
