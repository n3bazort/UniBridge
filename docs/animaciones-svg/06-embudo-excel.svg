      <rect id="celda-3-5" x="1168" y="290" width="120" height="56" rx="5"/>
    </g>
  </g>

  <!-- El embudo abre a la anchura de las torres del logo: 660 y 1260 -->
  <path id="embudo" d="M 660 410 L 905 660 L 905 730 M 1260 410 L 1015 660 L 1015 730"
