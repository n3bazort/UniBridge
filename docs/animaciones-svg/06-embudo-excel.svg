      <rect x="770" y="820" width="380" height="170" rx="14"/>
      <rect x="1190" y="820" width="380" height="170" rx="14"/>
      <circle cx="422" cy="905" r="40" stroke-width="7"/>
      <circle cx="842" cy="905" r="40" stroke-width="7"/>
      <circle cx="1262" cy="905" r="40" stroke-width="7"/>
    </g>
  </g>

  <g id="estado-final">
    <circle id="gota" cx="960" cy="775" r="14" fill="#2563EB"/>
    <g id="tarjetas">
      <g id="tarjeta-1">
        <rect x="350" y="820" width="380" height="170" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="5"/>
