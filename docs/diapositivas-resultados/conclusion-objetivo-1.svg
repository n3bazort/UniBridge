<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Conclusión del objetivo específico 1</title>
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <g id="encabezado">
    <rect x="80" y="72" width="72" height="8" rx="4" fill="#2563EB"/>
    <text x="168" y="86" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#2563EB">CAPÍTULO VI · CONCLUSIONES</text>
    <text x="80" y="162" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#0F172A">Conclusión del objetivo específico 1</text>
  </g>

  <text id="numero" x="80" y="560" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="800" fill="#DBEAFE">1</text>

  <g id="objetivo">
    <text x="420" y="286" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.4" fill="#2563EB">OBJETIVO ESPECÍFICO</text>
  <text x="420" y="330" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64748B">Analizar el procedimiento actual de emisión de solicitudes, designaciones y certificados, con el</text>
  <text x="420" y="364" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#64748B">fin de establecer los requerimientos funcionales y no funcionales de la aplicación web.</text>
  </g>

  <g id="conclusion">
    <rect x="420" y="452" width="1420" height="4" rx="2" fill="#DBEAFE"/>
    <text x="420" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.4" fill="#2563EB">CONCLUSIÓN</text>
  <text x="420" y="566" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#0F172A">El procedimiento vigente se documentó desde dos fuentes contrastadas —la entrevista a la</text>
  <text x="420" y="609" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#0F172A">funcionaria que ejecuta el trámite y el cuestionario al docente responsable—, cotejadas con los</text>
  <text x="420" y="652" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#0F172A">formatos institucionales y con expedientes de períodos anteriores. Las dos coincidieron en el</text>
  <text x="420" y="695" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#0F172A">origen de los errores, en la fragilidad del archivo físico y en el carácter manual de la</text>
  <text x="420" y="738" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#0F172A">coordinación de firmas. De cada punto crítico se derivó un requisito: ninguna función del sistema</text>
  <text x="420" y="781" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#0F172A">descansa sobre un supuesto.</text>
  </g>

  <text id="evidencia" x="420" y="980" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#94A3B8">Evidencia: Capítulo III, apartados 3.9.1 y 3.9.2 · Anexos A y J</text>
</svg>