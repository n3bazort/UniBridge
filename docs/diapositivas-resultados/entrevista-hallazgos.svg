<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Lo que reveló la entrevista</title>
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- ══ ENCABEZADO ═════════════════════════════════════════ -->
  <g id="encabezado">
    <rect x="80" y="72" width="72" height="8" rx="4" fill="#2563EB"/>
    <text x="168" y="86" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700"
          letter-spacing="6" fill="#2563EB">CAPÍTULO III · RESULTADOS</text>
    <text x="80" y="158" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800"
          fill="#0F172A">Lo que reveló la entrevista</text>
  </g>

  <!-- ══ CITA ═══════════════════════════════════════════════ -->
  <g id="cita">
    <rect x="80" y="196" width="1760" height="132" rx="18" fill="#EFF5FF"/>
    <rect x="80" y="196" width="8" height="132" rx="4" fill="#2563EB"/>
    <text x="132" y="300" font-family="Georgia, serif" font-size="150" fill="#2563EB" fill-opacity="0.16">“</text>
    <text x="228" y="252" font-family="Arial, Helvetica, sans-serif" font-size="38" font-style="italic"
          font-weight="700" fill="#1E3A8A">El problema no es hacer uno;</text>
    <text x="228" y="300" font-family="Arial, Helvetica, sans-serif" font-size="38" font-style="italic"
          font-weight="700" fill="#1E3A8A">el problema es el final del semestre.</text>
    <text x="1500" y="300" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7CA0E8">Funcionaria a cargo · Anexo A</text>
  </g>

  <!-- ══ TRES HALLAZGOS ═════════════════════════════════════ -->
  <text id="rotulo-hallazgos" x="80" y="382" font-family="Arial, Helvetica, sans-serif" font-size="17"
        font-weight="700" letter-spacing="2.4" fill="#2563EB">TRES HALLAZGOS</text>

  <!-- Hallazgo 1 · TIEMPO -->
  <g id="hallazgo-1">
    <rect x="80" y="400" width="565" height="248" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="132" cy="452" r="26" fill="#EFF5FF"/>
    <g stroke="#2563EB" stroke-width="2.6" fill="none" stroke-linecap="round">
      <circle cx="132" cy="452" r="13"/>
      <path d="M 132,445 L 132,452 L 138,456"/>
    </g>
    <text x="176" y="460" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800"
          letter-spacing="1.6" fill="#0F172A">TIEMPO</text>
    <text x="112" y="524" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">El trámite consume un tiempo</text>
    <text x="112" y="554" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">desproporcionado a su complejidad.</text>
  </g>

  <!-- Hallazgo 2 · FIABILIDAD -->
  <g id="hallazgo-2">
    <rect x="677" y="400" width="565" height="248" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="729" cy="452" r="26" fill="#FEF2F2"/>
    <g stroke="#DC2626" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 729,441 L 741,461 L 717,461 Z"/>
      <path d="M 729,449 L 729,453"/>
      <path d="M 729,457 L 729,457.5"/>
    </g>
    <text x="773" y="460" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800"
          letter-spacing="1.6" fill="#0F172A">FIABILIDAD</text>
    <text x="709" y="524" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">Al reutilizar un certificado anterior como</text>
    <text x="709" y="554" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">base, queda el nombre del estudiante</text>
    <text x="709" y="584" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">previo; se detecta cuando ya está firmado.</text>
  </g>

  <!-- Hallazgo 3 · PRESERVACIÓN -->
  <g id="hallazgo-3">
    <rect x="1274" y="400" width="565" height="248" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="1326" cy="452" r="26" fill="#EFF5FF"/>
    <g stroke="#2563EB" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 1314,447 h 8 l 3,-3 h 9 v 14 h -20 Z"/>
      <path d="M 1319,461 h 20 v -11"/>
    </g>
    <text x="1370" y="460" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800"
          letter-spacing="1.6" fill="#0F172A">PRESERVACIÓN</text>
    <text x="1306" y="524" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">Carpetas, impresos y nube, sin criterio</text>
    <text x="1306" y="554" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">común: no hay repositorio único.</text>
  </g>

  <!-- ══ CONECTOR · los tres hallazgos derivan en los requisitos ══ -->
  <g id="conector" stroke="#CBD5E1" stroke-width="3" fill="none" stroke-linecap="round">
    <path id="baja-h1" d="M 362,648 L 362,700"/>
    <path id="baja-h2" d="M 959,648 L 959,700"/>
    <path id="baja-h3" d="M 1556,648 L 1556,700"/>
    <path id="riel" d="M 291,700 L 1629,700"/>
    <g id="bajan-requisitos" stroke-linejoin="round">
      <path d="M 291,700 L 291,748 M 284,741 L 291,748 L 298,741"/>
      <path d="M 737,700 L 737,748 M 730,741 L 737,748 L 744,741"/>
      <path d="M 1183,700 L 1183,748 M 1176,741 L 1183,748 L 1190,741"/>
      <path d="M 1629,700 L 1629,748 M 1622,741 L 1629,748 L 1636,741"/>
    </g>
  </g>
  <g id="pastilla-derivan">
    <rect x="700" y="676" width="520" height="48" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="960" y="707" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19"
          font-weight="700" letter-spacing="2.2" fill="#2563EB">DE AHÍ SE DERIVAN CUATRO REQUISITOS</text>
  </g>

  <!-- ══ CUATRO REQUISITOS ══════════════════════════════════ -->
  <g id="requisito-1">
    <rect x="80" y="764" width="422" height="150" rx="16" fill="#EFF5FF"/>
    <circle cx="124" cy="808" r="21" fill="#2563EB"/>
    <text x="124" y="816" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21"
          font-weight="800" fill="#FFFFFF">1</text>
    <text x="160" y="802" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">Llenado automático de</text>
    <text x="160" y="830" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">plantillas</text>
    <text x="112" y="872" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Desde datos ya almacenados.</text>
  </g>

  <g id="requisito-2">
    <rect x="526" y="764" width="422" height="150" rx="16" fill="#EFF5FF"/>
    <circle cx="570" cy="808" r="21" fill="#2563EB"/>
    <text x="570" y="816" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21"
          font-weight="800" fill="#FFFFFF">2</text>
    <text x="606" y="802" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">Entrega en Word y en</text>
    <text x="606" y="830" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">PDF</text>
    <text x="558" y="872" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Cada formato para un uso distinto.</text>
  </g>

  <g id="requisito-3">
    <rect x="972" y="764" width="422" height="150" rx="16" fill="#EFF5FF"/>
    <circle cx="1016" cy="808" r="21" fill="#2563EB"/>
    <text x="1016" y="816" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21"
          font-weight="800" fill="#FFFFFF">3</text>
    <text x="1052" y="802" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">Circuito de firma</text>
    <text x="1052" y="830" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">ordenado</text>
    <text x="1004" y="872" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Respeta el orden entre autoridades.</text>
  </g>

  <g id="requisito-4">
    <rect x="1418" y="764" width="422" height="150" rx="16" fill="#EFF5FF"/>
    <circle cx="1462" cy="808" r="21" fill="#2563EB"/>
    <text x="1462" y="816" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21"
          font-weight="800" fill="#FFFFFF">4</text>
    <text x="1498" y="802" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">Accesos delimitados</text>
    <text x="1498" y="830" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">por rol</text>
    <text x="1450" y="872" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">El decano solo requiere firmar.</text>
  </g>

  <!-- ══ REMATE ═════════════════════════════════════════════ -->
  <g id="remate">
    <text x="960" y="988" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28"
          font-weight="700" font-style="italic" fill="#2563EB">El origen del error no está en el descuido, sino en el método.</text>
  </g>
</svg>
