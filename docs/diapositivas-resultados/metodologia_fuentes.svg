<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowSm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e8edf4"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <clipPath id="roundCard"><rect width="100%" height="100%" rx="20"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Top blue accent line -->
  <rect x="80" y="52" width="48" height="4" rx="2" fill="#2563eb"/>

  <!-- Chapter label -->
  <text x="140" y="58" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#2563eb" letter-spacing="3" text-transform="uppercase">CAPÍTULO III · MARCO INVESTIGATIVO</text>

  <!-- Main title -->
  <text x="80" y="120" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1">Metodología y fuentes</text>

  <!-- Subtitle -->
  <text x="80" y="158" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" fill="#64748b" font-weight="400">Diseño de la investigación, informantes clave y fuentes de información</text>


  <!-- ============ LEFT CARD: Diseño de la investigación ============ -->
  <g filter="url(#shadow)">
    <rect x="80" y="200" width="520" height="820" rx="20" fill="white"/>
  </g>

  <!-- Card header bar -->
  <rect x="80" y="200" width="520" height="60" rx="20" fill="#2563eb"/>
  <rect x="80" y="240" width="520" height="20" fill="#2563eb"/>
  <text x="340" y="238" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">DISEÑO DE LA INVESTIGACIÓN</text>

  <!-- Row 1: TIPO -->
  <g transform="translate(110, 300)">
    <circle cx="22" cy="0" r="22" fill="url(#blueGrad)"/>
    <text x="22" y="6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">1</text>
    <text x="60" y="-4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">TIPO</text>
    <text x="60" y="18" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Aplicada y descriptiva</text>
    <!-- Pills -->
    <rect x="60" y="30" width="110" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="115" y="51" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">Aplicada</text>
    <rect x="180" y="30" width="130" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="245" y="51" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">Descriptiva</text>
  </g>

  <!-- Divider -->
  <line x1="130" y1="378" x2="570" y2="378" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 2: DISEÑO -->
  <g transform="translate(110, 418)">
    <circle cx="22" cy="0" r="22" fill="url(#blueGrad)"/>
    <text x="22" y="6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">2</text>
    <text x="60" y="-4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">DISEÑO</text>
    <text x="60" y="18" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">No experimental</text>
    <rect x="60" y="30" width="170" height="32" rx="16" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="145" y="51" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#b45309" text-anchor="middle">No experimental</text>
  </g>

  <!-- Divider -->
  <line x1="130" y1="496" x2="570" y2="496" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 3: CORTE -->
  <g transform="translate(110, 536)">
    <circle cx="22" cy="0" r="22" fill="url(#blueGrad)"/>
    <text x="22" y="6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">3</text>
    <text x="60" y="-4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">CORTE</text>
    <text x="60" y="18" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Transversal</text>
    <rect x="60" y="30" width="130" height="32" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="125" y="51" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">Transversal</text>
  </g>

  <!-- Divider -->
  <line x1="130" y1="614" x2="570" y2="614" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 4: ENFOQUE -->
  <g transform="translate(110, 654)">
    <circle cx="22" cy="0" r="22" fill="url(#blueGrad)"/>
    <text x="22" y="6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">4</text>
    <text x="60" y="-4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">ENFOQUE</text>
    <text x="60" y="18" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Predominantemente cualitativa</text>
    <rect x="60" y="30" width="150" height="32" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="135" y="51" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">Cualitativa</text>
  </g>

  <!-- Divider -->
  <line x1="130" y1="732" x2="570" y2="732" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 5: MÉTODOS -->
  <g transform="translate(110, 772)">
    <circle cx="22" cy="0" r="22" fill="url(#blueGrad)"/>
    <text x="22" y="6" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">5</text>
    <text x="60" y="-4" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">MÉTODOS</text>
    <text x="60" y="18" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Inductivo y deductivo</text>
    <rect x="60" y="30" width="110" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="115" y="51" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">Inductivo</text>
    <rect x="180" y="30" width="120" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="240" y="51" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">Deductivo</text>
  </g>


  <!-- ============ RIGHT SECTION ============ -->

  <!-- Top right card: Informantes clave -->
  <g filter="url(#shadow)">
    <rect x="660" y="200" width="1180" height="280" rx="20" fill="white"/>
  </g>

  <!-- Card header -->
  <rect x="660" y="200" width="1180" height="56" rx="20" fill="#2563eb"/>
  <rect x="660" y="236" width="1180" height="20" fill="#2563eb"/>
  <text x="1250" y="234" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">INFORMANTES CLAVE</text>

  <!-- Description -->
  <text x="1250" y="296" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="500">
    <tspan font-weight="700" fill="#0f172a">Dos informantes clave</tspan>, que constituyen la <tspan font-weight="700" fill="#0f172a">totalidad</tspan> del personal a <tspan font-weight="700" fill="#0f172a">cargo del proceso</tspan>.
  </text>

  <!-- Informant 1 -->
  <g transform="translate(720, 330)">
    <rect width="540" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="60" cy="40" r="30" fill="#dbeafe"/>
    <!-- Person icon -->
    <circle cx="60" cy="32" r="10" fill="#2563eb"/>
    <path d="M42 56 c0-10 8-18 18-18 s18 8 18 18" fill="#2563eb"/>
    <text x="110" y="35" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Funcionaria administrativa</text>
    <text x="110" y="56" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Ejecuta el trámite de emisión</text>
    <rect x="110" y="72" width="190" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="205" y="91" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">Entrevista · 12 preguntas</text>
  </g>

  <!-- Informant 2 -->
  <g transform="translate(1300, 330)">
    <rect width="500" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="60" cy="40" r="30" fill="#dbeafe"/>
    <!-- Person icon -->
    <circle cx="60" cy="32" r="10" fill="#2563eb"/>
    <path d="M42 56 c0-10 8-18 18-18 s18 8 18 18" fill="#2563eb"/>
    <text x="110" y="35" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Docente responsable</text>
    <text x="110" y="56" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Responsable del proceso académico</text>
    <rect x="110" y="72" width="250" height="28" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="235" y="91" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Cuestionario autoadministrado</text>
  </g>


  <!-- Bottom right card: Fuentes de información -->
  <g filter="url(#shadow)">
    <rect x="660" y="520" width="1180" height="500" rx="20" fill="white"/>
  </g>

  <!-- Card header -->
  <rect x="660" y="520" width="1180" height="56" rx="20" fill="#2563eb"/>
  <rect x="660" y="556" width="1180" height="20" fill="#2563eb"/>
  <text x="1250" y="554" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">FUENTES DE INFORMACIÓN</text>

  <!-- Primarias section -->
  <g transform="translate(710, 610)">
    <circle cx="26" cy="16" r="26" fill="url(#blueGrad)"/>
    <!-- Document icon -->
    <rect x="16" y="5" width="18" height="22" rx="2" fill="none" stroke="white" stroke-width="2"/>
    <line x1="21" y1="12" x2="30" y2="12" stroke="white" stroke-width="1.5"/>
    <line x1="21" y1="17" x2="30" y2="17" stroke="white" stroke-width="1.5"/>
    <line x1="21" y1="22" x2="27" y2="22" stroke="white" stroke-width="1.5"/>

    <text x="68" y="10" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Primarias</text>
    <text x="68" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Obtenidas directamente del contexto institucional</text>
  </g>

  <!-- Primarias items -->
  <g transform="translate(710, 670)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="360" height="90" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="32" cy="45" r="18" fill="#dbeafe"/>
    <text x="32" y="50" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#2563eb">🎙️</text>
    <text x="62" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Entrevistas</text>
    <text x="62" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Semiestructuradas a los</text>
    <text x="62" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">informantes clave</text>

    <!-- Item 2 -->
    <rect x="380" y="0" width="360" height="90" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="412" cy="45" r="18" fill="#dbeafe"/>
    <text x="412" y="50" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#2563eb">📋</text>
    <text x="442" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Registros institucionales</text>
    <text x="442" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">De emisión y control de</text>
    <text x="442" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">documentos oficiales</text>

    <!-- Item 3 -->
    <rect x="760" y="0" width="360" height="90" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="792" cy="45" r="18" fill="#dbeafe"/>
    <text x="792" y="50" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#2563eb">📄</text>
    <text x="822" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Formatos oficiales</text>
    <text x="822" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Plantillas y formularios</text>
    <text x="822" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">actualmente en uso</text>
  </g>

  <!-- Divider -->
  <line x1="730" y1="790" x2="1810" y2="790" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Secundarias section -->
  <g transform="translate(710, 816)">
    <circle cx="26" cy="16" r="26" fill="#475569"/>
    <!-- Book icon -->
    <rect x="14" y="6" width="22" height="20" rx="2" fill="none" stroke="white" stroke-width="2"/>
    <line x1="25" y1="6" x2="25" y2="26" stroke="white" stroke-width="1.5"/>

    <text x="68" y="10" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Secundarias</text>
    <text x="68" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Literatura y documentación de referencia</text>
  </g>

  <!-- Secundarias items -->
  <g transform="translate(710, 876)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="360" height="90" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="32" cy="45" r="18" fill="#f1f5f9"/>
    <text x="32" y="50" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#475569">📘</text>
    <text x="62" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Manual PAP-01</text>
    <text x="62" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Procedimiento institucional</text>
    <text x="62" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">de prácticas preprofesionales</text>

    <!-- Item 2 -->
    <rect x="380" y="0" width="360" height="90" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="412" cy="45" r="18" fill="#f1f5f9"/>
    <text x="412" y="50" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#475569">🌐</text>
    <text x="442" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Literatura web</text>
    <text x="442" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Arquitectura web, frameworks</text>
    <text x="442" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">y automatización documental</text>

    <!-- Item 3 -->
    <rect x="760" y="0" width="360" height="90" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="792" cy="45" r="18" fill="#f1f5f9"/>
    <text x="792" y="50" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle" fill="#475569">🎓</text>
    <text x="822" y="34" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Trabajos de titulación</text>
    <text x="822" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Antecedentes de investigación</text>
    <text x="822" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">en el mismo dominio</text>
  </g>

</svg>
