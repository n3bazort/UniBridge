<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Requisitos funcionales y no funcionales</title>
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <g id="encabezado">
    <rect x="80" y="72" width="72" height="8" rx="4" fill="#2563EB"/>
    <text x="168" y="86" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700"
          letter-spacing="6" fill="#2563EB">CAPÍTULO IV · MARCO PROPOSITIVO</text>
    <text x="80" y="162" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800"
          fill="#0F172A">Quince requisitos funcionales, siete no funcionales</text>
    <text x="80" y="212" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#64748B">Ninguno se inventó: cada uno sale de algo observado en el terreno o de un formato institucional</text>
  </g>

  <!-- ══ FILA 1 · ACCESO Y DATOS MAESTROS ═══════════════════ -->
  <text x="80" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700"
        letter-spacing="2.4" fill="#94A3B8">ACCESO Y DATOS MAESTROS</text>
  <g id="fila-1">
    <rect x="80" y="302" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="108" y="336" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-01</text>
    <text x="108" y="366" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Autenticación y roles</text>

    <rect x="436" y="302" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="464" y="336" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-02</text>
    <text x="464" y="366" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Estructura académica</text>

    <rect x="792" y="302" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="820" y="336" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-03</text>
    <text x="820" y="366" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Cuentas de usuario</text>

    <rect x="1148" y="302" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="1176" y="336" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-04</text>
    <text x="1176" y="366" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Estudiantes y empresas</text>

    <rect x="1504" y="302" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="1532" y="336" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-05</text>
    <text x="1532" y="366" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Importación masiva Excel</text>
  </g>

  <!-- ══ FILA 2 · TRÁMITE Y DOCUMENTOS ══════════════════════ -->
  <text x="80" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700"
        letter-spacing="2.4" fill="#94A3B8">TRÁMITE Y DOCUMENTOS</text>
  <g id="fila-2">
    <rect x="80" y="456" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="108" y="490" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-06</text>
    <text x="108" y="520" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Seguimiento de prácticas</text>

    <rect x="436" y="456" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="464" y="490" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-07</text>
    <text x="464" y="520" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Plantillas documentales</text>

    <rect x="792" y="456" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="820" y="490" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-08</text>
    <text x="820" y="520" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Generación automática</text>

    <rect x="1148" y="456" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="1176" y="490" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-09</text>
    <text x="1176" y="520" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Codificación secuencial</text>

    <rect x="1504" y="456" width="336" height="88" rx="14" fill="#EFF5FF"/>
    <text x="1532" y="490" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-10</text>
    <text x="1532" y="520" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Lotes de firma</text>
  </g>

  <!-- ══ FILA 3 · FIRMA, CONTROL Y SALIDA ═══════════════════ -->
  <text x="80" y="594" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700"
        letter-spacing="2.4" fill="#94A3B8">FIRMA, CONTROL Y SALIDA</text>
  <g id="fila-3">
    <rect x="80" y="610" width="336" height="88" rx="14" fill="#EFF5FF"/>
    <text x="108" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-11</text>
    <text x="108" y="674" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Firmantes por invitación</text>

    <rect x="436" y="610" width="336" height="88" rx="14" fill="#EFF5FF"/>
    <text x="464" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-12</text>
    <text x="464" y="674" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Flujo secuencial de firma</text>

    <rect x="792" y="610" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="820" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-13</text>
    <text x="820" y="674" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Invalidación y versiones</text>

    <rect x="1148" y="610" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="1176" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-14</text>
    <text x="1176" y="674" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Trazabilidad y auditoría</text>

    <rect x="1504" y="610" width="336" height="88" rx="14" fill="#F1F5F9"/>
    <text x="1532" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2563EB">RF-15</text>
    <text x="1532" y="674" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">Reportes y panel</text>
  </g>

  <!-- ══ NO FUNCIONALES ═════════════════════════════════════ -->
  <g id="no-funcionales">
    <rect x="80" y="748" width="1760" height="222" rx="18" fill="#0F172A"/>
    <text x="112" y="798" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700"
          letter-spacing="2.4" fill="#7CA0E8">SIETE REQUISITOS NO FUNCIONALES</text>

    <text x="112" y="852" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Arquitectura modular y escalable</text>
    <text x="112" y="890" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Procesamiento asíncrono de operaciones pesadas</text>
    <text x="112" y="928" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Aislamiento de datos por facultad</text>

    <text x="700" y="852" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Credenciales con bcrypt, JWT de 15 minutos</text>
    <text x="700" y="890" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">y refresh rotativo de 7 días</text>
    <text x="700" y="928" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Contenerización integral con Docker Compose</text>

    <text x="1330" y="852" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Rendimiento de la interfaz</text>
    <text x="1330" y="890" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">Almacenamiento de objetos</text>
    <text x="1330" y="928" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#E2E8F0">compatible con S3</text>
  </g>
</svg>
